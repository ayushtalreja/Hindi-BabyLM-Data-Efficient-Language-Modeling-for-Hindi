# ==============================================================================
# Hindi BabyLM - 100M Words Configuration (BabyLM GPT-2 Baseline)
# ==============================================================================
# This configuration matches the BabyLM GPT-2 100M baseline architecture
# Based on config.json from the BabyLM team's GPT-2 100M model

# Experiment Configuration
experiment:
  name: "gpt2_100M_with_babaylm_config"
  description: "GPT-2 model matching BabyLM 100M baseline architecture"
  tags: ["babylm-baseline", "gpt2", "100M", "768-hidden"]

# Project Metadata
project:
  name: "hindi-babylm"
  description: "Data-efficient language modeling for Hindi - 100M training words"
  version: "1.0.0"
  track: "100M-training"

# Directory Structure
directories:
  data_dir: "data"
  model_dir: "results/experiment_name/models"
  tokenizer_dir: "tokenizers"
  results_dir: "results"
  checkpoint_dir: "checkpoints"
  logs_dir: "logs"

# ==============================================================================
# DATA CONFIGURATION
# ==============================================================================
data:
  # Word Budget - 100M for training, 10M each for val/test
  max_words: 100_000_000

  # Separate word limits for each split
  train_word_limit: 100_000_000  # 100M words for training
  val_word_limit: 10_000_000     # 10M words for validation
  test_word_limit: 10_000_000    # 10M words for test

  # Data Splits (legacy, not used with new split creation)
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1

  # Source Mixing Ratios (for training data only)
  train_source_ratios:
    indiccorp: 0.65        # 65% from IndicCorp
    wikipedia: 0.25        # 25% from Wikipedia
    indicdialogue: 0.05    # 5% from IndicDialogue
    childrens_books: 0.05  # 5% from children's books

  # Data Sources
  sources:
    indiccorp:
      enabled: true
      ratio: 0.65
      max_samples: 500000

    wikipedia:
      enabled: true
      ratio: 0.25
      dataset_version: "20231101.hi"
      max_articles: 50000

    indicdialogue:
      enabled: true
      ratio: 0.05
      max_movies: null
      combine_dialogues: false
      min_dialogue_length: 10

    childrens_books:
      enabled: true
      ratio: 0.05
      max_stories: 5000

  # Quality Filtering
  filtering:
    min_length: 30
    max_length: 2000
    min_hindi_ratio: 0.8
    min_word_count: 2
    max_word_count: 10000

  # Deduplication
  deduplication:
    enabled: true
    similarity_threshold: 0.8
    num_permutations: 256

  # Data Processing
  processing:
    unicode_normalization: "NFC"
    remove_urls: true
    remove_emails: true
    normalize_whitespace: true
    max_workers: 8

# ==============================================================================
# TOKENIZATION CONFIGURATION (BabyLM Baseline)
# ==============================================================================
tokenization:
  # Tokenizer Type
  type: "bpe"

  # Vocabulary (matching BabyLM baseline)
  vocab_size: 16384  # BabyLM GPT-2 baseline vocab size
  character_coverage: 0.9995

  # Special Tokens
  special_tokens:
    pad_token: "<pad>"
    unk_token: "<unk>"
    bos_token: "<s>"
    eos_token: "</s>"
    mask_token: "<mask>"
    sep_token: "<sep>"
    cls_token: "<cls>"

  # BPE Specific
  bpe:
    min_frequency: 2
    dropout: 0.0

# ==============================================================================
# MODEL ARCHITECTURE CONFIGURATION (BabyLM GPT-2 100M Baseline)
# ==============================================================================
model:
  # Model Type
  type: "gpt"

  # Model Size
  model_size: "babylm_baseline"

  # Core Architecture Hyperparameters (matching BabyLM GPT-2 100M baseline)
  architecture:
    hidden_size: 768           # n_embd from config.json
    num_hidden_layers: 12      # n_layer from config.json
    num_attention_heads: 12    # n_head from config.json
    intermediate_size: 3072    # n_inner (4 * hidden_size when null)
    max_position_embeddings: 1024  # n_positions from config.json

  # Regularization (matching BabyLM baseline)
  regularization:
    hidden_dropout_prob: 0.1        # embd_pdrop
    attention_probs_dropout_prob: 0.1  # attn_pdrop
    layer_norm_eps: 0.00001         # layer_norm_epsilon (1e-05)
    initializer_range: 0.02

  # Activation Functions (matching BabyLM baseline)
  activation: "gelu_new"  # activation_function from config.json

  # Layer Normalization
  layer_norm_type: "layernorm"

  # GPT-Specific Configurations (matching BabyLM baseline)
  gpt:
    use_cache: true                      # from config.json
    scale_attn_weights: true             # from config.json
    reorder_and_upcast_attn: false       # from config.json
    scale_attn_by_inverse_layer_idx: false

# ==============================================================================
# TRAINING CONFIGURATION
# ==============================================================================
training:
  # Basic Training Parameters
  batch_size: 16 
  gradient_accumulation_steps: 8  # Effective batch = 128 (16 * 8 = 128)
  num_epochs: 10
  max_steps: 211650

  # Optimization
  optimizer:
    type: "adamw"
    learning_rate: 0.00005 
    weight_decay: 0.01
    beta1: 0.9
    beta2: 0.999
    epsilon: 1.0e-8
    amsgrad: false

  # Learning Rate Scheduling
  lr_scheduler:
    type: "cosine_with_warmup"
    warmup_steps: 21165  # 10% of total steps
    warmup_ratio: 0.1
    num_cycles: 0.5
    min_lr_ratio: 0.0

  # Gradient Management
  gradient:
    max_grad_norm: 1.0
    gradient_checkpointing: true

  # Mixed Precision Training
  mixed_precision:
    enabled: true
    dtype: "bf16"
    opt_level: "O1"

  # Checkpointing
  checkpointing:
    save_strategy: "steps"
    save_steps: 2000
    save_total_limit: 3
    load_best_model_at_end: true
    metric_for_best_model: "eval_loss"
    greater_is_better: false

  # Evaluation
  evaluation:
    eval_strategy: "steps"
    eval_steps: 1000
    per_device_eval_batch_size: 64
    eval_accumulation_steps: null

  # Logging
  logging:
    log_level: "info"
    log_steps: 100
    report_to: ["wandb", "tensorboard"]

  # Early Stopping
  early_stopping:
    enabled: true
    patience: 5
    threshold: 0.001

  # Reproducibility
  seed: 42
  deterministic: true
  cuda_deterministic_algorithms: false

  # Evaluation Callbacks
  enable_eval_callback: false
  eval_frequency: 1
  eval_on_steps: []
  log_eval_to_wandb: true

  # Evaluation-Based Early Stopping
  eval_early_stopping: true
  eval_early_stopping_metric: "overall.average_accuracy"
  eval_early_stopping_patience: 5
  eval_early_stopping_mode: "max"
  eval_early_stopping_min_delta: 0.001

  # Checkpoint Selection Based on Evaluation
  checkpoint_metric: "overall.average_accuracy"
  checkpoint_metric_mode: "max"
  load_best_checkpoint_at_end: true

# ==============================================================================
# EVALUATION CONFIGURATION
# ==============================================================================
evaluation:
  # Evaluation Benchmarks
  benchmarks:
    indicglue:
      enabled: true
      tasks: ["BBCArticlesClassification", "Wikipedia Section Title Prediction", "CommonsenseQA", "WinogradNLI", "Choice of Plausible Alternatives", "MovieReviewSentiment", "ProductReviewSentiment", "DiscourseMode"]

      batch_size: 64
      max_samples_per_task: null

      # Fine-tuning configuration
      fine_tuning:
        enabled: true
        split_strategy: "original"
        train_ratio: 0.7
        val_ratio: 0.15
        test_ratio: 0.15
        split_seed: 42

        # Training hyperparameters
        num_epochs: 10
        early_stopping:
          enabled: true
          patience: 3
          metric: "accuracy"
          mode: "max"

        # Optimization
        learning_rate: 2e-5
        batch_size: 32
        weight_decay: 0.01
        warmup_ratio: 0.1

        # Model settings
        freeze_base_model: true
        dropout: 0.1

        # Checkpointing
        save_finetuned_models: false
        finetuned_models_dir: "finetuned_heads"

    multiblimp:
      enabled: true
      n_examples_per_phenomenon: 100

  # Perplexity Evaluation
  perplexity:
    enabled: true
    split: "test"
    report_per_source: true

  # Advanced Evaluation Features
  use_eval_cache: true
  cache_dir: ".eval_cache"
  max_cache_age_days: 30

  # Metrics Standardization
  bootstrap_samples: 1000
  confidence_level: 0.95
  aggregation_method: "macro"

  # Visualization Settings
  save_visualizations: true
  visualization_format: ["png", "html"]

  # Comparative Analysis
  enable_comparative_reports: true
  report_formats: ["html", "pdf"]
  comparative_analysis_dir: "comparative_analysis"

# ==============================================================================
# EXPERIMENT TRACKING
# ==============================================================================
experiment_tracking:
  # Weights & Biases
  wandb:
    enabled: true
    project: "hindi-babylm"
    tags: ["babylm-baseline", "hindi", "100m-words", "gpt2-768"]
    notes: "100M word training experiment - BabyLM GPT-2 baseline architecture"
    mode: "online"
    log_model: "checkpoint"

  # TensorBoard
  tensorboard:
    enabled: true
    log_dir: "logs/tensorboard"

  # MLflow
  mlflow:
    enabled: false
    tracking_uri: null
    experiment_name: "hindi-babylm"

# ==============================================================================
# RESOURCE MANAGEMENT
# ==============================================================================
resources:
  # Device Configuration
  device: "cuda"
  num_workers: 64

  # Memory Management
  pin_memory: true
  prefetch_factor: 2

  # Limits
  max_memory_per_gpu: null
  cpu_memory_limit: null

# ==============================================================================
# ANALYSIS & VISUALIZATION
# ==============================================================================
analysis:
  # Corpus Analysis
  corpus_statistics:
    enabled: true
    compute_vocab_stats: true
    compute_length_distribution: true
    compute_morphological_stats: true

  # Training Analysis
  training_analysis:
    plot_learning_curves: true
    plot_gradient_norms: true
    plot_attention_weights: false

  # Tokenization Analysis
  tokenization_analysis:
    compare_tokenizers: true
    analyze_morphological_boundaries: true
    coverage_analysis: true

  # Evaluation Analysis
  evaluation_analysis:
    generate_confusion_matrices: true
    error_analysis: true
    statistical_significance_tests: true

# ==============================================================================
# REPRODUCIBILITY & DEBUGGING
# ==============================================================================
reproducibility:
  # Seed Management
  seed: 42
  set_deterministic: true

  # Git Tracking
  track_git_commit: true
  save_git_diff: true

  # Environment
  save_environment: true
  save_system_info: true

debugging:
  # Debug Mode
  debug_mode: false

  # Profiling
  profile_training: false
  profile_evaluation: false

  # Validation
  validate_data_loader: true
  check_data_distribution: true
  detect_anomalies: false

  # Testing
  overfit_small_batch: false
  fast_dev_run: false
