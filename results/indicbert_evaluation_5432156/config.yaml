max_length: 128
eval_batch_size: 32
max_samples_per_task: null
eval_dropout: 0.0
evaluation:
  benchmarks:
    indicglue:
      fine_tuning:
        enabled: true
        split_strategy: original
        num_epochs: 10
        learning_rate: 2.0e-05
        batch_size: 32
        weight_decay: 0.01
        dropout: 0.1
        freeze_base_model: false
        use_auto_models: true
        early_stopping:
          patience: 3
          metric: accuracy
          mode: max
        task_specific_splits:
          Cloze-style multiple-choice QA:
            train_ratio: 0.8
            val_ratio: 0.1
            test_ratio: 0.1
            split_seed: 42
            reason: Dataset only has test split (35,140 examples); custom splits required
              for fine-tuning
  bootstrap_samples: 1000
  confidence_level: 0.95
  save_visualizations: true
  visualization_format:
  - png
  - html
  use_eval_cache: false
