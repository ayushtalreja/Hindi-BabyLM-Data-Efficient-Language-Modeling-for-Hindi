batch_size: 32
data_dir: data
deberta_config: null
deduplication:
  enabled: true
  num_permutations: 256
  similarity_threshold: 0.8
device: cuda
dropout: 0.1
eval_steps: 500
experiment_description: Baseline GPT model on 10M word corpus with fine tuning on
  IndicGLUE with 16K vocab size
experiment_name: gpt_10M_bpe_16k
experiment_tags:
- ablation
- tokenizer
- bpe
- vocab-16k
- 10M
filtering:
  max_length: 2000
  max_word_count: 10000
  min_hindi_ratio: 0.8
  min_length: 30
  min_word_count: 2
gpt_config: !!python/object:src.utils.experiment_config.GPTModelConfig
  reorder_and_upcast_attn: false
  scale_attn_weights: true
  use_cache: true
hidden_size: 768
intermediate_size: 3072
learning_rate: 0.0005
log_steps: 100
max_length: 512
max_tokens: null
max_words: 10000000
mixed_precision_dtype: bf16
model_dir: results/experiment_name/models
model_size: small
model_type: gpt
num_epochs: 10
num_heads: 12
num_layers: 12
num_workers: 4
pin_memory: true
results_dir: results
save_steps: 1000
sources:
  childrens_books:
    enabled: true
    max_stories: 8000
    ratio: 0.05
  indiccorp:
    enabled: true
    max_samples: 150000
    ratio: 0.5
  indicdialogue:
    combine_dialogues: false
    enabled: true
    max_movies: null
    min_dialogue_length: 10
    ratio: 0.15
  wikipedia:
    dataset_version: 20231101.hi
    enabled: true
    max_articles: 100000
    ratio: 0.3
test_ratio: 0.1
test_word_limit: 10000000
tokenizer_dir: tokenizers_bpe_16k
tokenizer_type: bpe
train_ratio: 0.8
train_source_ratios:
  childrens_books: 0.05
  indiccorp: 0.5
  indicdialogue: 0.15
  wikipedia: 0.3
train_word_limit: 10000000
val_ratio: 0.1
val_word_limit: 10000000
vocab_size: 16384
warmup_steps: 1500
weight_decay: 0.01
